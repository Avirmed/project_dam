<div class="app-json-data" data-field="Flow">
    <div class="row">
        <div class="col-12">
            <div class="p-2">
                <div class="form-check form-switch">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="status">
                        <small>{{ StaticText.Status }}</small>
                    </label>
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="p-2">
                <div class="row align-items-start">
                    <div class="col-md-5 mb-2">
                        <div class="form-group field-basic" data-field="AreaID">
                            <label class="small mb-2" for="AreaID">{{ StaticText.AreaField.AreaID }}</label>
                            <select class="selectTwo form-control-sm" id="AreaID" name="AreaID" data-url="/api/areas/list?status=1">
                                <option value="" selected>-- {{ StaticText.Choose }} --</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
