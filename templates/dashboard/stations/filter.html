<div class="tabulator-filters stations-filters mb-4">
	<div class="row">
        <div class="col-xl-3 col-lg-4 col-md-6">
            <div class="row align-items-center mb-3">
                <div class="col-auto">
                    <label class="small" for="ProjectIDFilter">{{ StaticText.ProjectField.ProjectName }}</label>
                </div>
                <div class="col">
                    <select class="form-control form-control-sm select2" id="ProjectIDFilter" name="ProjectID" data-url="/api/projects/list?status=1">
                        <option value="" selected>-- {{ StaticText.All }} --</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-lg-4 col-md-6">
            <div class="row align-items-center mb-3">
                <div class="col-auto">
                    <label class="small" for="RiverBasinIDFilter">{{ StaticText.RiverBasinField.WatershedName }}</label>
                </div>
                <div class="col">
                    <select class="form-control form-control-sm select2" id="RiverBasinIDFilter" name="RiverBasinID" data-url="/api/riverbasins/list?status=1">
                        <option value="" selected>-- {{ StaticText.All }} --</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-lg-4 col-md-6">
            <div class="row align-items-center mb-3">
                <div class="col-auto">
                    <label class="small" for="RegionFilter">{{ StaticText.StationField.Region }}</label>
                </div>
                <div class="col">
                    <select class="form-control form-control-sm select2" id="RegionFilter" name="Region">
                        <option value="" selected>-- {{ StaticText.All }} --</option>
                        {% for key, value in StaticText.Regions.items() %}
                        <option value="{{ key }}">{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>
	<div class="row">
		<div class="col-xl-3 col-lg-4 col-md-6 mb-3">
			<div class="row align-items-center">
				<div class="col-auto">
					<label class="small" for="StatusFilter">{{ StaticText.StationField.Status }}</label>
				</div>
				<div class="col">
					<select class="form-control form-control-sm select2" id="StatusFilter" name="Status">
						<option value="" selected>-- {{ StaticText.All }} --</option>
						{% for key, value in StaticText.StatusLabel.items() %}
						<option value="{{ key }}">{{ value.text }}</option>
						{% endfor %}
					</select>
				</div>
			</div>
		</div>
	</div>
</div>
