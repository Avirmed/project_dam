{# Header notifications: newest pending security events (static/js/notifications.js
   <- POST /api/eventlog/latest, refreshed every minute) #}
{% set T = StaticText.FrontPage.Notifications %}
<div class="me-1 notification_item">
    <a href="#" class="btn btn-menubar position-relative me-1" id="notification_popup" data-bs-toggle="dropdown" data-bs-auto-close="outside">
        <i class="ti ti-bell"></i>
        <span class="notification-status-dot d-none"></span>
        <span class="notification-count d-none"></span>
    </a>
    <div class="dropdown-menu dropdown-menu-end notification-dropdown p-3">
        <div class="d-flex align-items-center justify-content-between border-bottom pb-2 mb-2">
            <h6 class="notification-title mb-0">{{ T.Title }}</h6>
            <small class="text-muted notification-summary"></small>
        </div>
        <div class="noti-content">
            <div class="d-flex flex-column notification-list"></div>
            <div class="text-muted small text-center py-3 notification-empty">{{ T.Empty }}</div>
        </div>
        <div class="d-flex p-0 mt-2">
            <a class="btn btn-sm btn-light w-100 me-2" href="javascript:void(0);" data-close-dropdown>{{ StaticText.Cancel }}</a>
            <a class="btn btn-sm btn-primary w-100" href="/events">{{ T.ViewAll }}</a>
        </div>
    </div>
</div>
