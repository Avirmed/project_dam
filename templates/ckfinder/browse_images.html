<!DOCTYPE html>
<html lang="{{ StaticText.APP_LANG }}">
    <head>
        <meta charset="UTF-8" />
        <title>{{ StaticText.CKFinderFields.ImageTitle }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/css/bootstrap.min.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/plugins/tabler-icons/tabler-icons.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f5f5f5;
                margin: 20px;
            }

            h3 {
                margin-bottom: 20px;
            }

            .image-item {
                background: white;
                border: 1px solid #ccc;
                padding: 5px;
                border-radius: 5px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
                width: 150px;
                text-align: center;
                position: relative;
            }

            .image-item img {
                object-fit: cover;
                border: 1px solid #eee;
                width: 100%;
                height: 120px;
                border-radius: 3px;
                cursor: pointer;
            }

            .image-item .dropdown{
                position: absolute;
                opacity: 0;
                transition: opacity 0.2s;
            }

            .image-item:hover .dropdown{
                opacity: 1;
            }

            .image-item .dropdown .dropdown-toggle::after {
                display: none;
            }

            .dropdown-menu {
                min-width: 100px;
                font-size: 0.8rem;
            }

            .image-item.selected {
                border-color: #007bff;
                box-shadow: 0 0 8px #007bff;
            }

            #upload-form {
                margin: auto;
                margin-bottom: 25px;
                padding: 15px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                max-width: 500px;
            }

            #upload-form input[type="file"] {
                display: inline-block;
                margin-right: 10px;
                font-size: 0.8rem;
            }

            #upload-status {
                margin-top: 10px;
                font-size: 12px;
            }

            .dropdown-menu a{
                text-decoration: none;
                color: #007bff;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h3>{{ StaticText.CKFinderFields.ImageTitle }}</h3>
            <form id="upload-form" enctype="multipart/form-data" method="POST" action="{{ url_for('ckfinder_bp.upload_image') }}">
                <div class="d-flex justify-content-between align-items-center">
                    <input type="file" name="upload" required />
                    <input type="hidden" name="CKEditorFuncNum" value="{{ func_num }}" />
                    <button class="btn btn-success btn-sm" type="submit">
                        {{ StaticText.Icon.Save | safe }} {{ StaticText.Upload }}
                    </button>
                </div>
                <div id="upload-status"></div>
            </form>
            <div class="gallery d-flex flex-wrap gap-2">
                {% for file, url in files_and_urls %}
                <div class="image-item" title="{{ file }}">
                    <img src="{{ url }}" alt="{{ file }}" onclick="selectImage('{{ url }}', this)" />
                    <div class="dropdown position-absolute top-0 end-0 m-2">
                        <button class="btn btn-sm btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            {{ StaticText.Icon.VerticalDots | safe }}
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="{{ url }}" target="_blank">
                                    {{ StaticText.Icon.Download | safe}} {{ StaticText.Download }}
                                </a>
                            </li>
                            <li>
                                {# Энд url.split('/uploads/')[1] ашиглан зөв замыг дамжуулна #}
                                <button class="dropdown-item text-danger" 
                                        onclick="deleteImage('{{ url.split('/uploads/')[1] }}', this.closest('.image-item')); event.stopPropagation();">
                                    {{ StaticText.Icon.Delete | safe}} {{ StaticText.Delete }}
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <script src="{{ url_for('static', filename='js/libs/jquery-3.7.1.min.js') }}"></script>
        <script src="{{ url_for('static', filename='dist/js/bootstrap.bundle.min.js') }}"></script>
        <script src="{{ url_for('static', filename='js/libs/toastr/toastr.min.js') }}"></script>

        <script>

            function selectImage(url, el) {
                document.querySelectorAll('.image-item').forEach(i => i.classList.remove('selected'));
                el.classList.add('selected');
                if (window.opener && window.opener.CKEDITOR) {
                    let funcNum = {{ func_num | tojson }};
                    window.opener.CKEDITOR.tools.callFunction(funcNum, url);
                    window.close();
                } else {
                    toastr.warning("{{ StaticText.Messages.CKEditorNotFound }}");
                }
            }

            function deleteImage(filepath, element) {
                if (!confirm("{{ StaticText.Messages.DeleteQuestion }}")) return;
                fetch('{{ url_for("ckfinder_bp.delete_file") }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: 'filepath=' + encodeURIComponent(filepath)
                }).then(res => res.json())
                  .then(data => {
                      if (data.success) {
                          element.remove();
                          toastr.success("{{ StaticText.Messages.SuccessDeleted }}");
                      } else {
                          toastr.error(data.error || "{{ StaticText.Messages.Error }}");
                      }
                  }).catch(() => {
                      toastr.error("{{ StaticText.Messages.NoInternetConnection }}");
                  });
            }

            document.getElementById('upload-form').addEventListener('submit', function (e) {
                e.preventDefault();
                let formData = new FormData(this);
                let status = document.getElementById('upload-status');
                status.textContent = "{{  StaticText.Messages.Uploading }}";

                fetch(this.action + '?CKEditorFuncNum=' + formData.get('CKEditorFuncNum'), {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                }).then(response => response.text())
                    .then(data => {
                        status.textContent = "{{  StaticText.Messages.UploadSuccess }}";
                        setTimeout(() => window.location.reload(), 1200);
                    }).catch(err => {
                        status.textContent = "{{  StaticText.Messages.UploadFailed }} " + err;
                    });
            });
        </script>
    </body>
</html>
