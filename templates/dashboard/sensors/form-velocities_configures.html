{% from "dashboard/main/config_field.html" import render_field with context %}
<div class="app-json-data" data-field="Velocities">
    <div class="row">
        <div class="col-12">
            <div class="p-2">
                <div class="form-check form-switch">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="status">
                        <small>{{ StaticText.Status }}</small>
                    </label>
                </div>
            </div>
        </div>
        <div class="col-12">
        {% for settings in StaticText.SensorVelocityConfigures %}
            <div class="p-2">
                <div class="row align-items-start">
                {% for key, field in settings.fields.items() %}
                    <div class="col-lg-6 mb-2">
                        <div class="form-group field-basic" data-field="{{ key }}">
                            {{ render_field(key, field) }}
                        </div>
                    </div>
                {% endfor %}
                </div>
            </div>
        {% endfor %}
        </div>
    </div>
</div>
