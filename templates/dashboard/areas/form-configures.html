{% from "dashboard/main/config_field.html" import render_field with context %}
<div class="app-json-data" data-field="Configures">
    <div class="row">
        {% for settings in StaticText.AreaConfigures %}
        <div class="col-lg-4">
            <div class="p-2">
                <h6 class="mb-2">{{ settings.title }}</h6>
                <div class="row align-items-start">
                {% for key, field in settings.fields.items() %}
                    <div class="col-12 mb-2">
                        <div class="form-group field-basic" data-field="{{ key }}">
                            {{ render_field(key, field) }}
                        </div>
                    </div>
                {% endfor %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
