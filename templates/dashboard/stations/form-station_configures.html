<div class="app-json-data" data-field="StationConfigures">
    <div class="row">
        <div class="col-12">
            <div class="p-2">
                <div class="form-check form-switch">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="status">
                        <small>{{ StaticText.Status }}</small>
                    </label>
                </div>
            </div>
        </div>
        {% for settings in StaticText.StationConfigures %}
        <div class="col-md-6 mb-3">
            <div class="p-2">
                <h5 class="mb-3">{{ settings.title }}</h5>
                {% for key, field in settings.fields.items() %}
                <div class="form-group field-basic mb-2">
                    <label class="small mb-2">{{ field.title }}</label>
                    <input
                        type="text"
                        name="{{ key }}"
                        class="form-control form-control-sm" 
                        placeholder="{{ field.placeholder }}"
                    >
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
