<div class="row">
    <div class="col-lg-6 mb-3">
        <label class="small mb-2" for="CameraID">{{ StaticText.CameraField.CameraID }}</label>
        <input type="text" class="form-control form-control-sm" id="CameraID" name="CameraID" required>
    </div>

    <div class="col-lg-6 mb-3">
        <label class="small mb-2" for="CameraName">{{ StaticText.CameraField.CameraName }}</label>
        <input type="text" class="form-control form-control-sm" id="CameraName" name="CameraName" required>
    </div>
</div>

<div class="row">
    <div class="col-lg-6 mb-3">
        <div class="form-check form-switch">
            <input type="hidden" name="Status" value="0">
            <input class="form-check-input" type="checkbox" id="Status" name="Status" value="1">
            <label class="small" for="Status">{{ StaticText.CameraField.Status }}</label>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12 mb-3">
        <label class="small mb-2" for="Remark">{{ StaticText.CameraField.Remark }}</label>
        <textarea class="form-control form-control-sm" id="Remark" name="Remark"></textarea>
    </div>
</div>
