<form class="appLoginForm">
    <div class="d-flex flex-column p-4 pb-0">
        <div class="">
            <div class="mb-3">
                <label>
                    <span class="small fw-bolder">{{ StaticText.UserField.UserName }}</span>
                    <div class="account-group">
                        <input type="text" class="form-control form-control-sm"
                            name="UserName"
                            data-msg-required="{{ StaticText.Messages.UserNameIsRequired }}"
                            required autofocus
                        >
                        <span class="account-icon ti ti-user"></span>
                    </div>
                </label>
            </div>
            <div class="mb-3">
                <label>
                    <span class="small fw-bolder">{{ StaticText.UserField.Password }}</span>
                    <div class="pass-group">
                        <input type="password" class="pass-input form-control form-control-sm"
                            name="Password"
                            data-msg-required="{{ StaticText.Messages.UserPasswordIsRequired }}"
                            required data-rule-minlength="6"
                        >
                        <span class="ti toggle-password ti-eye-off"></span>
                    </div>
                </label>
            </div>
            <div class="d-flex align-items-center mb-3">
                <div class="d-flex align-items-center">
                    <div class="form-check mb-0">
                        <label class="mt-0">
                            <input class="form-check-input" type="checkbox" name="RememberMe">
                            <small>{{ StaticText.RememberMe}}</small>
                        </label>
                    </div>
                </div>
                <div class="text-end d-none">
                    <a href="javascript:;" class="link-danger">{{ StaticText.ForgotPassword}}</a>
                </div>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-sm btn-primary w-100">{{ StaticText.LoginIn }}</button>
            </div>
        </div>
    </div>
</form>
