<div class="row">
    <div class="col-lg-6 mb-3">
        <label class="small mb-2" for="SensorID">{{ StaticText.SensorField.SensorID }}</label>
        <input type="text" class="form-control form-control-sm" id="SensorID" name="SensorID" required>
    </div>

    <div class="col-lg-6 mb-3">
        <label class="small mb-2" for="SensorName">{{ StaticText.SensorField.SensorName }}</label>
        <input type="text" class="form-control form-control-sm" id="SensorName" name="SensorName" required>
    </div>
</div>

<div class="row">
    <div class="col-lg-6 mb-3">
        <label class="small mb-2" for="SensorType">{{ StaticText.SensorField.SensorType }}</label>
        <select class="selectTwo form-control-sm" id="SensorType" name="SensorType" required>
            <option value="" selected>-- {{ StaticText.Choose }} --</option>
            {% for key, value in StaticText.SensorTypes.items() %}
            <option value="{{ key }}">{{ value }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="row">
    <div class="col-lg-6 mb-3">
        <div class="form-check form-switch">
            <input type="hidden" name="Status" value="0">
            <input class="form-check-input" type="checkbox" id="Status" name="Status" value="1">
            <label class="small" for="Status">{{ StaticText.SensorField.Status }}</label>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12 mb-3">
        <label class="small mb-2" for="Remark">{{ StaticText.RiverBasinField.Remark }}</label>
        <textarea class="form-control form-control-sm" id="Remark" name="Remark"></textarea>
    </div>
</div>
